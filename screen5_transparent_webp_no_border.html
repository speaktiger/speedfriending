<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Screen 5 — Transparent WebP / seamless</title>
<style>

:root {
  --bg:#dbe6f6; --card:#ffffff; --fg:#14161c; --dim:#3a4353; --muted:#78849a;
  --line:#b9c9e2; --accent:#3d81e8; --green:#77b34d;
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; height:100%; overflow:hidden; }
body {
  background:var(--bg); color:var(--fg);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  display:flex; flex-direction:column; height:100dvh;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
header {
  flex:0 0 auto; display:flex; justify-content:space-between; align-items:center;
  padding:9px 16px; font-size:12px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--muted); gap:10px;
}
#hostinfo,#mode { flex:1 1 0; min-width:0; }
#mode { display:flex; justify-content:flex-end; }
#logo {
  width:44px; height:44px; border-radius:10px; background:#14161c; color:white;
  display:grid; place-items:center; font-weight:900; font-size:12px; letter-spacing:0;
}
#help {
  background:none; border:0; color:var(--muted); width:44px; height:44px; padding:10px;
}
#help svg { width:22px; height:22px; display:block; }
#stage {
  flex:1 1 auto; min-height:0; overflow:hidden; display:flex; flex-direction:column;
  padding:clamp(8px,1.2vh,12px) 20px 10px;
}
.scr {
  flex:1 1 auto; min-height:0; display:flex; flex-direction:column;
  justify-content:center; gap:clamp(14px,2.6vh,26px); overflow:hidden;
}
.scr-head { flex:0 0 auto; text-align:center; }
h1 {
  margin:0; font-weight:800; line-height:1.03;
  font-size:clamp(28px,7.4vmin,84px); letter-spacing:-.02em;
  white-space:nowrap; overflow:hidden; padding:.04em 0 .15em;
}
.imgwrap {
  flex:1 1 0; min-height:0; width:100%; align-self:stretch;
  max-height:60vh; overflow:hidden; border-radius:12px;
  display:flex; align-items:center; justify-content:center;
}
.imgwrap img { width:100%; height:100%; object-fit:cover; display:block; }
.body {
  flex:0 0 auto; display:flex; flex-direction:column;
  font-size:clamp(15px,2.45vmin,29px); gap:.98em;
}
ul.tags {
  list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:.45em;
}
ul.tags.stack {
  display:grid; grid-template-columns:minmax(0,max-content); justify-content:center;
}
ul.tags li {
  width:100%; text-align:center; border-radius:8px; padding:.42em .7em;
  font-weight:700; font-size:1.14em; line-height:1.25;
}
.t-sky { background:#d3e2f8; color:#1b3a6d; }
.t-cyan { background:#cbe6ec; color:#14454f; }
.t-slate { background:#d9dee8; color:#2e3849; }

@media (min-width:900px) {
  #stage { padding:clamp(16px,2.6vh,34px) 5vw 2vh; }
  .scr.split {
    display:grid; grid-template-columns:minmax(0,5fr) minmax(0,7fr);
    grid-template-rows:auto minmax(0,1fr); gap:clamp(16px,2.6vh,32px) 4vw;
    align-items:center;
  }
  .scr.split .scr-head { grid-column:1 / -1; }
  .scr.split .imgwrap { margin:0; min-height:0; align-self:center; height:100%; }
}
@media (max-width:899px) {
  .scr.split:not(.rot) { justify-content:flex-start; }
}


/* TEST B ONLY: transparent artwork, no image-frame treatment */
.imgwrap {
  border-radius:0;
  overflow:hidden;
}

</style>
