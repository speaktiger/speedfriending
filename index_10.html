<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111318">
<title>SpeakTiger — Sync Test v10</title>
<style>
  :root {
    --bg: #111318;
    --fg: #f2f4f8;
    --muted: #7c8698;
    --accent: #4a86e8;
    --warn: #e0a04a;
    --bad: #e08a8a;
    --good: #7ac97a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
  }
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 0; font-size: 13px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--muted);
  }
  #room { font-weight: 700; color: var(--fg); }
  main {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
  }
  #screen { font-size: 27vw; font-weight: 800; line-height: 1; }
  #label { color: var(--muted); margin-top: 8px; font-size: 15px; }
  #syncing { display: none; font-size: 18px; color: var(--muted); }
  .syncing #screen, .syncing #label { display: none; }
  .syncing #syncing { display: block; }
  .offline #screen { opacity: .55; }

  #status { padding: 12px 0 4px; text-align: center; font-size: 13px; color: var(--muted); }
  .stale #status { color: var(--warn); }
  .offline #status { color: var(--bad); }
  #diag { text-align: center; font-size: 11px; color: #4d5566; padding-bottom: 10px; }
  #err { color: var(--bad); font-size: 13px; text-align: center; padding-bottom: 6px; }

  #wakebar { display: flex; align-items: center; gap: 10px; padding-bottom: 12px; }
  #wakestate { flex: 1; font-size: 12px; color: var(--muted); }
  #wakestate.on { color: var(--good); }
  #wakebtn { flex: 0 0 auto; padding: 12px 18px; font-size: 14px; }

  #retrybar { display: none; gap: 8px; padding-bottom: 10px; }
  .stale #retrybar, .offline #retrybar { display: flex; }
  .stale #retrybar, .offline #retrybar { display: block; }
  #retrybar button { flex: 1; padding: 14px 0; font-size: 15px; }
  #controls { display: none; gap: 10px; padding-bottom: 16px; }
  .host #controls, .offline #controls { display: flex; }
  button {
    padding: 20px 0; font-size: 18px; font-weight: 700;
    border: 0; border-radius: 12px; background: #222634; color: var(--fg);
  }
  #controls button { flex: 1; }
  button:active { background: #2d3346; }
  button.primary { background: var(--accent); }
</style>
</head>
<body class="syncing">

<header>
  <span id="room">—</span>
  <span id="mode"></span>
</header>

<main>
  <div id="syncing">syncing…</div>
  <div id="screen">–</div>
  <div id="label">screen</div>
</main>

<div id="err"></div>
<div id="status">starting…</div>
<div id="diag"></div>

<div id="wakebar">
  <span id="wakestate">screen lock: not requested</span>
  <button id="wakebtn">Keep screen on</button>
</div>

<div id="retrybar"><button id="retry">Retry connection</button><button id="hard">Hard reset</button></div>

<div id="controls">
  <button id="prev">‹ Back</button>
  <button id="next" class="primary">Next ›</button>
</div>

<script>
/* ------------------------------------------------------------------
   CONFIG
------------------------------------------------------------------ */
const API        = "https://speaktiger-sync.speaktiger.workers.dev";
const POLL_MS    = 3000;    // TESTING. Ship at 15000.
const RETRY_MS   = 4000;    // cadence while disconnected
const TIMEOUT_MS = 7000;    // covers headers AND body parsing
const SYNC_DELAY = 400;
const STALE_MS   = 15000;
const OFF_MS     = 30000;
const MAX_SCREEN = 31;
const SW_CACHE   = "speaktiger-shell";
const QUIET_MS   = 30000;   // silence window when ?quiet=1

/* ------------------------------------------------------------------
   STATE
------------------------------------------------------------------ */
const params = new URLSearchParams(location.search);
const room   = params.get("r") || "lisbon";
const key    = params.get("k");
const isHost = !!key;
const QUIET  = params.get("quiet") === "1";   // experiment: go silent after 2 fails

const startedAt = Date.now();
let screenNo      = null;
let lastUpdatedAt = -1;     // rejects out-of-order responses
let lastOkAt      = 0;
let manual        = null;
let haveData      = false;
let showSyncing   = true;
let syncTimer     = null;
let inFlight      = false;  // exactly one logical request at a time
let generation    = 0;      // responses from older generations are discarded
let consecFails   = 0;
let pulls = 0, fails = 0, timeouts = 0;
let lastErr = "", swState = "none", proto = "?";
let wakeLock = null;
let nextTryAt = 0;
let quietSince = 0;

const $ = (id) => document.getElementById(id);
$("room").textContent = room;
$("mode").textContent = isHost ? "host" : "";
if (isHost) document.body.classList.add("host");

try {
  const cached = localStorage.getItem("st_screen_" + room);
  if (cached !== null) screenNo = Number(cached);
} catch (e) {}

/* ------------------------------------------------------------------
   RENDER
------------------------------------------------------------------ */
function render() {
  const shown = manual !== null ? manual : screenNo;
  $("screen").textContent = shown === null ? "\u2013" : shown;

  const age     = Date.now() - (lastOkAt || startedAt);
  const offline = age > OFF_MS;
  const stale   = !offline && age > STALE_MS;
  const syncing = showSyncing && !haveData && !offline && !stale && shown === null;

  $("label").textContent =
    manual !== null ? "manual" : (haveData ? "screen" : "last known");

  document.body.classList.toggle("syncing", syncing);
  document.body.classList.toggle("stale",   stale);
  document.body.classList.toggle("offline", offline);

  if (syncing)       $("status").textContent = "syncing\u2026";
  else if (offline)  $("status").textContent = quietPause()
                       ? "offline \u2014 next try in " + quietLeft() + "s"
                       : (shown === null
                           ? "offline \u2014 no connection yet"
                           : "offline \u2014 pick the screen manually");
  else if (stale)    $("status").textContent = quietPause()
                       ? "reconnecting\u2026 next try in " + quietLeft() + "s"
                       : "reconnecting\u2026";
  else if (haveData) $("status").textContent = "in sync";
  else               $("status").textContent = "syncing\u2026";

  const secs = lastOkAt ? Math.round((Date.now() - lastOkAt) / 1000) + "s ago" : "never";
  $("diag").innerHTML =
    `last ok: ${secs} \u00b7 polls ${pulls} \u00b7 fails ${fails} \u00b7 timeouts ${timeouts}` +
    `<br>onLine: ${navigator.onLine} \u00b7 sw: ${swState} \u00b7 consec ${consecFails}` +
    ` \u00b7 ${inFlight ? "fetching" : "idle"} \u00b7 proto ${proto}` +
    (QUIET ? ` \u00b7 QUIET${quietPause() ? " " + quietLeft() + "s" : ""}` : "") +
    (lastErr ? `<br><span style="color:#e08a8a">${lastErr}</span>` : "");
}

/* ------------------------------------------------------------------
   NETWORK — one request, one deadline covering headers + body
------------------------------------------------------------------ */
function readProtocol(url) {
  try {
    const es = performance.getEntriesByType("resource");
    for (let i = es.length - 1; i >= 0; i--) {
      if (es[i].name.startsWith(url.split("?")[0]) && es[i].nextHopProtocol) {
        proto = es[i].nextHopProtocol;
        return;
      }
    }
  } catch (e) {}
}

async function request(url, opts) {
  const ctrl = new AbortController();
  const t = setTimeout(() => { try { ctrl.abort(); } catch (e) {} }, TIMEOUT_MS);
  try {
    const res = await fetch(url, { ...opts, signal: ctrl.signal, cache: "no-store" });
    if (!res.ok) {
      let msg = "HTTP " + res.status;
      try { const j = await res.json(); if (j && j.error) msg = j.error; } catch (e) {}
      throw new Error(msg);
    }
    const data = await res.json();   // still inside the deadline
    readProtocol(url);
    return data;
  } finally {
    clearTimeout(t);
  }
}

async function pull() {
  if (inFlight) return;
  inFlight = true;
  const myGen = ++generation;

  clearTimeout(syncTimer);
  if (!haveData) {
    syncTimer = setTimeout(() => { showSyncing = true; render(); }, SYNC_DELAY);
  }

  try {
    const url = `${API}/state?r=${encodeURIComponent(room)}&_=${Date.now()}`;
    const data = await request(url);

    if (myGen !== generation) return;                       // obsolete
    if (data.updatedAt !== undefined &&
        data.updatedAt < lastUpdatedAt) return;             // out of order

    if (data.updatedAt !== undefined) lastUpdatedAt = data.updatedAt;
    if (data.screen !== screenNo) {
      screenNo = data.screen;
      try { localStorage.setItem("st_screen_" + room, String(screenNo)); } catch (e) {}
    }
    lastOkAt    = Date.now();
    haveData    = true;
    showSyncing = false;
    manual      = null;
    consecFails = 0;
    lastErr     = "";
    try { sessionStorage.removeItem("st_reloads"); } catch (e) {}
    $("err").textContent = "";
  } catch (e) {
    fails++;
    consecFails++;
    if (e && e.name === "AbortError") timeouts++;
    lastErr = (e && (e.name + ": " + e.message)) || String(e);
  } finally {
    clearTimeout(syncTimer);
    inFlight = false;
    pulls++;
    render();
  }
}

async function push(target) {
  if (inFlight) return;
  inFlight = true;
  try {
    const url = `${API}/state?r=${encodeURIComponent(room)}&k=${encodeURIComponent(key)}&_=${Date.now()}`;
    const data = await request(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ screen: target, endsAt: null, ts: Date.now() }),
    });
    if (data.updatedAt !== undefined) lastUpdatedAt = data.updatedAt;
    screenNo = data.screen;
    lastOkAt = Date.now();
    haveData = true;
    consecFails = 0;
    lastErr = "";
    $("err").textContent = "";
  } catch (e) {
    lastErr = (e && (e.name + ": " + e.message)) || String(e);
    $("err").textContent = e && e.message === "bad key"
      ? "bad key" : "not sent \u2014 no connection";
  } finally {
    inFlight = false;
    render();
  }
}

function quietPause() {
  return QUIET && consecFails >= 2 && Date.now() < nextTryAt;
}
function quietLeft() {
  return Math.max(0, Math.ceil((nextTryAt - Date.now()) / 1000));
}

/* single coalescing entry point for every trigger.
   During a quiet window we deliberately stay silent, even when iOS reports
   the network is back — that is the whole point of the experiment. */
function kick() {
  if (inFlight) return;
  if (quietPause()) return;
  pull();
}

/* ------------------------------------------------------------------
   CONTROLS
------------------------------------------------------------------ */
function step(delta) {
  const base = manual !== null ? manual : (screenNo ?? 1);
  const target = Math.min(MAX_SCREEN, Math.max(1, base + delta));
  const live = haveData && (Date.now() - lastOkAt) <= OFF_MS;
  if (isHost && live) push(target);
  else { manual = target; render(); }
}
$("next").onclick = () => step(1);
$("prev").onclick = () => step(-1);

$("retry").onclick = () => { generation++; inFlight = false; lastErr = ""; nextTryAt = 0; pull(); };

/* scoped: only our own registration and our own cache */
$("hard").onclick = async () => {
  try {
    if (navigator.serviceWorker) {
      const rs = await navigator.serviceWorker.getRegistrations();
      const here = new URL("./", location.href).href;
      await Promise.all(rs.filter(r => r.scope === here).map(r => r.unregister()));
    }
    if (window.caches) await caches.delete(SW_CACHE);
  } catch (e) {}
  location.reload();
};

/* ------------------------------------------------------------------
   WAKE LOCK
------------------------------------------------------------------ */
function setWakeState(text, on) {
  const el = $("wakestate");
  el.textContent = "screen lock: " + text;
  el.classList.toggle("on", !!on);
}

async function acquireWakeLock(quiet) {
  if (!("wakeLock" in navigator)) { setWakeState("not supported", false); return; }
  if (wakeLock) { setWakeState("held", true); return; }
  if (document.visibilityState !== "visible") return;
  try {
    wakeLock = await navigator.wakeLock.request("screen");
    setWakeState("held", true);
    wakeLock.addEventListener("release", () => {
      wakeLock = null;
      setWakeState("released \u2014 tap the screen", false);
    });
  } catch (e) {
    wakeLock = null;
    setWakeState(quiet ? "tap the screen to keep it on"
                       : "refused (" + (e.name || "error") + ") \u2014 check Low Power Mode", false);
  }
}
$("wakebtn").onclick = () => acquireWakeLock(false);

document.addEventListener("click", function onTap() {
  acquireWakeLock(false).then(() => {
    if (wakeLock) document.removeEventListener("click", onTap);
  });
}, { passive: true });

/* ------------------------------------------------------------------
   LIFECYCLE — one scheduler, everything else coalesces into kick()
------------------------------------------------------------------ */
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") { kick(); acquireWakeLock(true); }
});
window.addEventListener("online",   kick);
window.addEventListener("pageshow", kick);

const noSW = params.get("nosw") === "1";
if ("serviceWorker" in navigator) {
  if (noSW) {
    swState = "disabled";
    navigator.serviceWorker.getRegistrations()
      .then(rs => Promise.all(rs.map(r => r.unregister()))).catch(() => {});
  } else {
    swState = navigator.serviceWorker.controller ? "controlling" : "registering";
    navigator.serviceWorker.register("sw.js")
      .then(() => { swState = navigator.serviceWorker.controller ? "controlling" : "registered"; })
      .catch(() => { swState = "failed"; });
  }
} else {
  swState = "unsupported";
}

function nextDelay() {
  if (consecFails === 0) return POLL_MS;
  if (QUIET && consecFails >= 2) return QUIET_MS;
  return RETRY_MS;
}
function loop() {
  pull().finally(() => {
    const d = nextDelay();
    nextTryAt = Date.now() + d;
    if (QUIET && consecFails >= 2 && !quietSince) quietSince = Date.now();
    if (consecFails === 0) quietSince = 0;
    setTimeout(loop, d);
  });
}
loop();
setInterval(render, 1000);

</script>
</body>
</html>
