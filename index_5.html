<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111318">
<title>SpeakTiger — Sync Test v5</title>
<style>
  :root {
    --bg: #111318;
    --fg: #f2f4f8;
    --muted: #7c8698;
    --accent: #4a86e8;
    --warn: #e0a04a;
    --bad: #e08a8a;
    --good: #7ac97a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
  }
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 0; font-size: 13px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--muted);
  }
  #room { font-weight: 700; color: var(--fg); }
  main {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
  }
  #screen { font-size: 27vw; font-weight: 800; line-height: 1; }
  #label { color: var(--muted); margin-top: 8px; font-size: 15px; }
  #syncing { display: none; font-size: 18px; color: var(--muted); }
  .syncing #screen, .syncing #label { display: none; }
  .syncing #syncing { display: block; }
  .offline #screen { opacity: .55; }

  #status { padding: 12px 0 4px; text-align: center; font-size: 13px; color: var(--muted); }
  .stale #status { color: var(--warn); }
  .offline #status { color: var(--bad); }
  #diag { text-align: center; font-size: 11px; color: #4d5566; padding-bottom: 10px; }
  #err { color: var(--bad); font-size: 13px; text-align: center; padding-bottom: 6px; }

  #wakebar { display: flex; align-items: center; gap: 10px; padding-bottom: 12px; }
  #wakestate { flex: 1; font-size: 12px; color: var(--muted); }
  #wakestate.on { color: var(--good); }
  #wakebtn { flex: 0 0 auto; padding: 12px 18px; font-size: 14px; }

  #retrybar { display: none; gap: 8px; padding-bottom: 10px; }
  .stale #retrybar, .offline #retrybar { display: flex; }
  .stale #retrybar, .offline #retrybar { display: block; }
  #retrybar button { flex: 1; padding: 14px 0; font-size: 15px; }
  #controls { display: none; gap: 10px; padding-bottom: 16px; }
  .host #controls, .offline #controls { display: flex; }
  button {
    padding: 20px 0; font-size: 18px; font-weight: 700;
    border: 0; border-radius: 12px; background: #222634; color: var(--fg);
  }
  #controls button { flex: 1; }
  button:active { background: #2d3346; }
  button.primary { background: var(--accent); }
</style>
</head>
<body class="syncing">

<header>
  <span id="room">—</span>
  <span id="mode"></span>
</header>

<main>
  <div id="syncing">syncing…</div>
  <div id="screen">–</div>
  <div id="label">screen</div>
</main>

<div id="err"></div>
<div id="status">starting…</div>
<div id="diag"></div>

<div id="wakebar">
  <span id="wakestate">screen lock: not requested</span>
  <button id="wakebtn">Keep screen on</button>
</div>

<div id="retrybar"><button id="retry">Retry connection</button><button id="hard">Hard reset</button></div>

<div id="controls">
  <button id="prev">‹ Back</button>
  <button id="next" class="primary">Next ›</button>
</div>

<script>
/* ------------------------------------------------------------------
   CONFIG
------------------------------------------------------------------ */
const API        = "https://speaktiger-sync.speaktiger.workers.dev";
const POLL_MS    = 3000;    // TESTING. Ship at 15000.
const TIMEOUT_MS = 6000;    // abandon a request that never answers
const SYNC_DELAY = 400;     // only show "syncing…" if slower than this
const STALE_MS   = 15000;
const OFF_MS     = 30000;
const MAX_SCREEN = 31;

/* ------------------------------------------------------------------
   STATE
------------------------------------------------------------------ */
const params = new URLSearchParams(location.search);
const room   = params.get("r") || "lisbon";
const key    = params.get("k");
const isHost = !!key;

const startedAt = Date.now();
let screenNo    = null;     // may come from cache before any fetch
let lastOkAt    = 0;
let manual      = null;
let haveData    = false;    // true only after a successful fetch
let showSyncing = true;
let syncTimer   = null;
let inFlightSince = 0;
let pulls = 0, fails = 0, timeouts = 0, stuck = 0;
let lastErr = "";
let swState = "none";
let wakeLock = null;

const $ = (id) => document.getElementById(id);
$("room").textContent = room;
$("mode").textContent = isHost ? "host" : "";
if (isHost) document.body.classList.add("host");

try {
  const cached = localStorage.getItem("st_screen_" + room);
  if (cached !== null) screenNo = Number(cached);
} catch (e) {}

/* ------------------------------------------------------------------
   RENDER
------------------------------------------------------------------ */
function render() {
  const shown = manual !== null ? manual : screenNo;
  $("screen").textContent = shown === null ? "–" : shown;

  // age counts from the last success, or from page load if never succeeded
  const age     = Date.now() - (lastOkAt || startedAt);
  const offline = age > OFF_MS;
  const stale   = !offline && age > STALE_MS;

  // never sit on "syncing…" forever — fall back to whatever we have
  const syncing = showSyncing && !haveData && !offline && !stale && shown === null;

  $("label").textContent =
    manual !== null ? "manual" : (haveData ? "screen" : "last known");

  document.body.classList.toggle("syncing", syncing);
  document.body.classList.toggle("stale",   stale);
  document.body.classList.toggle("offline", offline);

  if (syncing)      $("status").textContent = "syncing…";
  else if (offline) $("status").textContent = shown === null
                      ? "offline — no connection yet"
                      : "offline — pick the screen manually";
  else if (stale)   $("status").textContent = "reconnecting…";
  else if (haveData)$("status").textContent = "in sync";
  else              $("status").textContent = "syncing…";

  const secs = lastOkAt ? Math.round((Date.now() - lastOkAt) / 1000) + "s ago" : "never";
  $("diag").innerHTML =
    `last ok: ${secs} · polls ${pulls} · fails ${fails} · timeouts ${timeouts} · stuck ${stuck}` +
    (inFlightSince ? " · fetching" : "") +
    `<br>onLine: ${navigator.onLine} · sw: ${swState}` +
    (lastErr ? `<br><span style="color:#e08a8a">${lastErr}</span>` : "");
}

/* ------------------------------------------------------------------
   NETWORK — timeout, watchdog, cache-buster
------------------------------------------------------------------ */
function timedFetch(url, opts = {}) {
  const ctrl = new AbortController();
  const abortTimer = setTimeout(() => { try { ctrl.abort(); } catch (e) {} }, TIMEOUT_MS);

  // Belt and braces: iOS can throttle the abort timer, so race it too.
  const guard = new Promise((_, reject) =>
    setTimeout(() => reject(new DOMException("timeout", "AbortError")), TIMEOUT_MS + 1500)
  );

  return Promise.race([
    fetch(url, { ...opts, signal: ctrl.signal, cache: "no-store" }),
    guard,
  ]).finally(() => clearTimeout(abortTimer));
}

async function pull() {
  // watchdog: never let a hung request block polling forever
  if (inFlightSince) {
    if (Date.now() - inFlightSince < TIMEOUT_MS * 2) return;
    inFlightSince = 0;            // force-release, assume it is dead
    stuck++;
  }
  inFlightSince = Date.now();

  clearTimeout(syncTimer);
  if (!haveData) {
    syncTimer = setTimeout(() => { showSyncing = true; render(); }, SYNC_DELAY);
  }

  try {
    const url = `${API}/state?r=${encodeURIComponent(room)}&_=${Date.now()}`;
    const res = await timedFetch(url);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();

    if (data.screen !== screenNo) {
      screenNo = data.screen;
      try { localStorage.setItem("st_screen_" + room, String(screenNo)); } catch (e) {}
    }
    lastOkAt    = Date.now();
    haveData    = true;
    showSyncing = false;
    manual      = null;              // broadcast always wins
    lastErr     = "";
    $("err").textContent = "";
  } catch (e) {
    fails++;
    if (e && e.name === "AbortError") timeouts++;
    lastErr = (e && (e.name + ": " + e.message)) || String(e);
  } finally {
    clearTimeout(syncTimer);
    inFlightSince = 0;
    pulls++;
    render();
  }
}

async function push(target) {
  const body = { screen: target, endsAt: null, ts: Date.now() };
  try {
    const res = await timedFetch(
      `${API}/state?r=${encodeURIComponent(room)}&k=${encodeURIComponent(key)}&_=${Date.now()}`,
      { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }
    );
    const data = await res.json();
    if (!res.ok) { $("err").textContent = data.error || "write failed"; return; }
    screenNo = data.screen;
    lastOkAt = Date.now();
    haveData = true;
    $("err").textContent = "";
  } catch (e) {
    $("err").textContent = "offline — change not sent";
  }
  render();
}

/* ------------------------------------------------------------------
   CONTROLS
------------------------------------------------------------------ */
function step(delta) {
  const base = manual !== null ? manual : (screenNo ?? 1);
  const target = Math.min(MAX_SCREEN, Math.max(1, base + delta));
  const live = haveData && (Date.now() - lastOkAt) <= OFF_MS;
  if (isHost && live) push(target);
  else { manual = target; render(); }
}
$("next").onclick = () => step(1);
$("prev").onclick = () => step(-1);

/* ------------------------------------------------------------------
   WAKE LOCK
------------------------------------------------------------------ */
function setWakeState(text, on) {
  const el = $("wakestate");
  el.textContent = "screen lock: " + text;
  el.classList.toggle("on", !!on);
}

async function acquireWakeLock() {
  if (!("wakeLock" in navigator)) { setWakeState("not supported", false); return; }
  if (wakeLock) { setWakeState("held", true); return; }
  if (document.visibilityState !== "visible") return;
  try {
    wakeLock = await navigator.wakeLock.request("screen");
    setWakeState("held", true);
    wakeLock.addEventListener("release", () => {
      wakeLock = null;
      setWakeState("released by phone", false);
    });
  } catch (e) {
    wakeLock = null;
    setWakeState("refused (" + (e.name || "error") + ") — check Low Power Mode", false);
  }
}
$("wakebtn").onclick = acquireWakeLock;

/* any first touch counts as the gesture — survives a mid-event reload */
["pointerdown", "touchstart", "click"].forEach((ev) =>
  document.addEventListener(ev, acquireWakeLock, { once: true, passive: true })
);

/* ------------------------------------------------------------------
   LIFECYCLE
------------------------------------------------------------------ */
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") { pull(); acquireWakeLock(); }
});
window.addEventListener("online",   pull);
window.addEventListener("pageshow", pull);

const noSW = params.get("nosw") === "1";
if ("serviceWorker" in navigator) {
  if (noSW) {
    swState = "disabled";
    navigator.serviceWorker.getRegistrations()
      .then(rs => Promise.all(rs.map(r => r.unregister())))
      .then(() => { if (caches && caches.keys) caches.keys().then(ks => ks.forEach(k => caches.delete(k))); })
      .catch(() => {});
  } else {
    swState = navigator.serviceWorker.controller ? "controlling" : "registering";
    navigator.serviceWorker.register("sw.js")
      .then(() => { swState = navigator.serviceWorker.controller ? "controlling" : "registered"; })
      .catch(e => { swState = "failed"; });
  }
} else {
  swState = "unsupported";
}

$("retry").onclick = () => { inFlightSince = 0; lastErr = ""; pull(); };

$("hard").onclick = async () => {
  try {
    if (navigator.serviceWorker) {
      const rs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(rs.map(r => r.unregister()));
    }
    if (window.caches) {
      const ks = await caches.keys();
      await Promise.all(ks.map(k => caches.delete(k)));
    }
  } catch (e) {}
  location.reload();
};

/* Self-rescheduling loop plus an independent heartbeat: if one stalls
   under iOS throttling, the other still fires. */
function loop() {
  pull().finally(() => setTimeout(loop, POLL_MS));
}
loop();
setInterval(() => { if (!inFlightSince) pull(); }, POLL_MS * 2);
setInterval(render, 1000);
</script>
</body>
</html>
