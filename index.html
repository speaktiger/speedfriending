<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#dbe6f6">
<title>SpeakTiger — Speed Friending 0.9 beta</title>
<style>
  /* ==================================================================
     PALETTE — derived from the deck. Light only.
  ================================================================== */
  :root {
    --bg:      #dbe6f6;   /* deck slide background */
    --card:    #ffffff;
    --fg:      #14161c;
    --dim:     #3a4353;
    --muted:   #78849a;
    --line:    #b9c9e2;
    --accent:  #3d81e8;   /* deck cover blue */
    --green:   #77b34d;   /* deck accent bar */
    --tagbg:   #c6dbf6;
    --tagfg:   #12305e;
    --warn:    #e8a13c;
    --bad:     #d95d5d;
    --good:    #5fb35f;
    --move:    #b84ae0;
    --stay:    #f0cf3a;
    --onmove:  #ffffff;
    --onstay:  #22200a;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--bg); color: var(--fg);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; height: 100dvh;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }

  /* ---------- system banner (one treatment for every state) ---------- */
  #banner {
    display: none; flex: 0 0 auto; text-align: center;
    font-size: clamp(10px, 1.3vmin, 13px); letter-spacing: .14em;
    text-transform: uppercase; font-weight: 800;
    padding: 6px 10px; color: #2a1c05; background: var(--warn);
  }
  #banner.on { display: block; }
  #banner.bad { background: var(--bad); color: #fff; }
  #banner.good { background: var(--good); color: #08240b; }
  #banner.grey { background: #98a3b4; color: #14161c; }
  .dot { opacity: .25; animation: blink 1.35s infinite; }
  .dot:nth-child(2) { animation-delay: .22s; }
  .dot:nth-child(3) { animation-delay: .44s; }
  @keyframes blink { 0%,60%,100% { opacity: .25; } 30% { opacity: 1; } }

  #testbtn.ok  { background: var(--good); color: #08240b; }
  #testbtn.bad { background: var(--bad);  color: #fff; }

  /* the round timer: consumed time filling left to right. Absent means no
     clock is running, which is itself the information. */
  #timer { display: none; flex: 0 0 auto; height: 7px; background: rgba(20,22,28,.10); overflow: hidden; }
  #timer.on { display: block; }
  #timerfill { height: 100%; width: 0%; background: var(--green); transition: width 1s linear; }
  #timer.jump #timerfill { transition: none; }

  header {
    flex: 0 0 auto; display: flex; justify-content: space-between; align-items: center;
    padding: 9px 16px; font-size: 12px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--muted); gap: 10px;
  }
  #hostinfo, #mode { flex: 1 1 0; min-width: 0; white-space: nowrap; }
  #hostinfo { display: flex; gap: 8px; align-items: baseline; }
  #mode { text-align: right; }
  #roomlbl { font-weight: 800; color: var(--fg); }
  /* host only. Underlined when it is the offline stopwatch — that is the one
     state where the digits are a control rather than a readout. */
  #hostclock { font-variant-numeric: tabular-nums; font-weight: 800; color: var(--fg);
               font-size: 20px; letter-spacing: 0; }
  #hostclock.local { cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  #hostclock.idle { color: var(--muted); }
  #hostclock.over { color: var(--bad); }
  /* sizing mirrored from the Soda app, centred instead of left */
  #logowrap {
    flex: 0 0 auto; position: relative; display: block; padding: 3px; border-radius: 11px;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    transition: transform .13s ease, filter .13s ease;
  }
  #logowrap.pressing { transform: scale(.96); filter: brightness(.88); transition-duration: 0s; }
  /* the hold indicator: instant press feedback says "heard you", the fill says
     "keep going" — a tap alone does nothing here, so plain button feedback
     would promise something that is not about to happen */
  #logowrap::after {
    content: ""; position: absolute; left: 0; top: 0; height: 100%; width: 0;
    background: rgba(20,22,28,.13); border-radius: 11px; pointer-events: none;
  }
  #logowrap.pressing::after { width: 100%; transition: width 1.5s linear; }
  #logo { display: block; height: 60px; width: auto; max-width: 220px; object-fit: contain; }
  #logo.mark { height: 40px; width: 40px; }
  @media (orientation: landscape) and (max-height: 520px) {
    #logo { height: 40px; max-width: 160px; }
    #logo.mark { height: 30px; width: 30px; }
  }
  #count { display: none; }
  .host #count, .offline #count, .preview #count, .detached #count { display: block; }
  #count {
    text-align: center; font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--muted); font-variant-numeric: tabular-nums; padding-bottom: 8px;
  }

  /* ---------- stage ---------- */
  #stage { flex: 1 1 auto; min-height: 0; overflow: hidden; display: flex; flex-direction: column; padding: 0 20px 10px; }
  #syncmsg { flex: 1; display: none; align-items: center; justify-content: center; color: var(--muted); font-size: 18px; }
  .syncing #stage { display: none; }
  .syncing #syncmsg { display: flex; }

  .scr { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  .scr.mid > .scr-head, .scr.mid > .body { width: 100%; max-width: min(100%, 880px); margin-inline: auto; }
  .scr-head { flex: 0 0 auto; text-align: center; }
  .eyebrow {
    font-size: clamp(12px, 1.9vmin, 19px); letter-spacing: .1em;
    text-transform: uppercase; color: var(--muted); font-weight: 800; margin-bottom: .35em;
  }
  h1 { margin: 0; font-weight: 800; line-height: 1.03; font-size: clamp(25px, 6vmin, 70px); letter-spacing: -.02em; }
  .sub { margin: .5em auto 0; color: var(--dim); font-size: clamp(14px, 2.2vmin, 26px); line-height: 1.35; max-width: 34ch; }

  /* image — the only flexible element */
  .imgwrap { flex: 1 1 0; min-height: 0; width: 100%; align-self: stretch; overflow: hidden; margin: 22px 0; display: flex; align-items: center; justify-content: center; }
  .ph {
    width: 100%; height: auto; max-width: 100%; max-height: 100%; aspect-ratio: var(--ratio, 4/3);
    border: 2px dashed var(--line); border-radius: 12px; background: rgba(255,255,255,.45);
    display: flex; align-items: center; justify-content: center; text-align: center;
    color: var(--muted); font-size: 11px; letter-spacing: .07em; text-transform: uppercase; padding: 6px;
  }
  .imgwrap img { width: 100%; height: auto; max-width: 100%; max-height: 100%;
                 aspect-ratio: var(--ratio, 4/3); object-fit: contain; border-radius: 12px; }

  .body { flex: 0 0 auto; display: flex; flex-direction: column;
          font-size: clamp(15px, 2.45vmin, 29px); gap: .98em; }

  /* ---------- keyword cloud ---------- */
  ul.tags {
    list-style: none; margin: 0; padding: 0;
    display: flex; flex-wrap: wrap; gap: .45em;
  }
  ul.tags li {
    flex: 1 1 auto; text-align: center;
    border-radius: 999px;
    padding: .465em .752em;
    font-weight: 800; font-size: 1.14em; line-height: 1.2;
  }
  /* info screens: one per line, all the same width, centred */
  ul.tags.stack { display: grid; grid-template-columns: minmax(0, max-content); justify-content: center; }
  ul.tags.stack li { flex: none; width: 100%; }
  /* screen 9 only: chevrons are real rows, so the gap above and below each
     one is the same value rather than the result of arithmetic */
  ul.tags.flow { gap: .61em; }
  ul.tags.flow li.chev {
    background: none; padding: 0; width: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  ul.tags.flow li.chev svg { width: .89em; height: auto; display: block; }

  /* palette deliberately excludes purple + yellow — those two mean "move" and "stay" */
  .t-blue  { background: #c6dbf6; color: #12305e; }
  .t-green { background: #cfe6bc; color: #2f5218; }
  .t-teal  { background: #bee2df; color: #0f4340; }
  .t-coral { background: #f9cec6; color: #70271c; }

  /* ---------- question band ---------- */
  .qband {
    background: var(--card); border-left: 5px solid var(--green); border-radius: 12px;
    padding: .65em .86em;
  }
  .qband .qhead {
    font-size: .82em; font-weight: 800; color: var(--muted);
    letter-spacing: .04em; margin-bottom: .45em;
  }
  .qband ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .29em; }
  .qband li {
    color: var(--dim); font-weight: 600; font-size: .90em; line-height: 1.3;
    display: flex; gap: .55em;
  }
  .qband li::before { content: "\2014"; color: var(--muted); flex: 0 0 auto; }
  .qsec + .qsec { margin-top: .82em; }

  /* ---------- tip block ---------- */
  .tip {
    background: var(--card); border-left: 5px solid var(--accent); border-radius: 12px;
    padding: .65em .86em;
    display: flex; gap: .57em; align-items: center;
  }
  .tip .ico {
    flex: 0 0 auto; width: 1.56em; height: 1.56em;
    border-radius: 50%; background: var(--accent); color: #fff;
    font-family: Georgia, "Times New Roman", serif; font-style: italic; font-weight: 700;
    font-size: .78em; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .tip p { margin: 0; color: var(--dim); font-weight: 600; font-size: .90em; line-height: 1.35; }

  /* ---------- signature: TIME'S UP ---------- */
  .scr.rot h1 { font-size: clamp(34px, 9vmin, 118px); letter-spacing: -.03em; }
  .chips { display: flex; flex-direction: column; gap: .69em; }
  .chip {
    border-radius: 16px; padding: .67em .81em;
    font-weight: 700; font-size: 1.76em; line-height: 1.2;
  }
  .chip b { font-weight: 900; }
  .chip.move { background: var(--move); color: var(--onmove); }
  .chip.stay { background: var(--stay); color: var(--onstay); }
  .spin { flex: 0 0 auto; display: flex; justify-content: center; padding-top: clamp(2px, .8vmin, 10px); }
  .spin svg { width: 3.43em; height: auto; animation: flip 4s infinite; }
  @keyframes flip {
    0%   { transform: rotate(0deg);   animation-timing-function: linear; }
    34%  { transform: rotate(0deg);   animation-timing-function: cubic-bezier(.68,-.32,.28,1.34); }
    50%  { transform: rotate(180deg); animation-timing-function: linear; }
    84%  { transform: rotate(180deg); animation-timing-function: cubic-bezier(.68,-.32,.28,1.34); }
    100% { transform: rotate(360deg); }
  }

  /* ---------- screen 3 ---------- */
  .test { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; gap: 5vmin; text-align: center; }
  #testbtn { align-self: center; min-width: min(60%, 320px); }

  /* ---------- cover ---------- */
  .cover { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 2vmin; }
  .lozenge {
    background: #14161c; color: #f4f6fa; border-radius: clamp(13px, 2.4vmin, 32px);
    padding: clamp(9px, 2vmin, 28px) clamp(15px, 3.2vmin, 44px);
    font-weight: 900; letter-spacing: -.02em; line-height: .96;
    font-size: clamp(29px, 7.8vmin, 98px); text-align: center; flex: 0 0 auto;
  }

  /* ---------- host notes ---------- */
  /* The panel used to sit IN the layout, which made the host's stage shorter
     than the room's — the fit pass then shrank the text and squeezed the
     images out. As an overlay the host sees exactly what the guests see. */
  #tipswrap { display: none; position: relative; flex: 0 0 auto; }
  .host #tipswrap { display: block; }
  #tipsbar {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 9px 0 11px; cursor: pointer; border-top: 1px solid var(--line);
    font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
    font-weight: 800; color: var(--muted);
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  #tipsarrow {
    width: 9px; height: 9px; border-left: 2.5px solid var(--muted);
    border-top: 2.5px solid var(--muted); transform: rotate(45deg);
    transition: transform .18s ease; margin-bottom: 2px;
  }
  .tipsopen #tipsarrow { transform: rotate(225deg); margin: 2px 0 0; }
  #notes {
    display: none; position: absolute; bottom: 100%; left: 0; right: 0;
    max-height: 40vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
    /* mostly opaque plus a blur: the screen behind reads as shape and colour
       instead of competing words, which is what makes the tip fast to read */
    background: rgba(255,255,255,.9);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-top: 3px solid var(--green); border-radius: 14px 14px 0 0;
    box-shadow: 0 -12px 34px rgba(20,22,28,.16);
    padding: 14px 16px; font-size: 15px; line-height: 1.45;
  }
  .tipsopen #notes { display: block; }
  #notes .cues, #notes .qs { margin: 8px 0 0; padding: 0; list-style: none; color: var(--dim); font-size: 13.5px; }
  #notes .cues li { display: flex; gap: .5em; margin-top: 5px; }
  #notes .cues li::before { content: "▸"; color: var(--green); }
  #notes .qs li { margin-top: 4px; }
  #notes .lbl { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 800; margin-bottom: 5px; }

  /* ---------- footer ---------- */
  footer { flex: 0 0 auto; padding: 0 16px 10px; }
  #diag { text-align: center; font-size: 10.5px; color: var(--muted); opacity: .8; padding: 4px 0 6px; }
  #diag.off { display: none; }
  #wakebar { display: none; align-items: center; gap: 10px; padding-bottom: 10px; }
  .host #wakebar, body.wake #wakebar { display: flex; }
  #wakestate { flex: 1; font-size: 12px; color: var(--muted); }
  #wakestate.on { color: #2f7a2f; }
  #retrybar { display: none; gap: 8px; padding-bottom: 8px; }
  .host.stale #retrybar, .host.offline #retrybar,
  body.debug.stale #retrybar, body.debug.offline #retrybar { display: flex; }
  #retrybar button { flex: 1; padding: 13px 0; font-size: 14px; }
  #controls { display: none; gap: 10px; }
  .host #controls, .offline #controls, .preview #controls, .detached #controls { display: flex; }
  button {
    padding: 18px 0; font-size: 17px; font-weight: 800; border: 0; border-radius: 12px;
    background: var(--card); color: var(--fg); font-family: inherit; cursor: pointer; box-shadow: 0 1px 0 var(--line);
  }
  /* the global tap-highlight reset removes the native press flash, and a
     brightness shift alone is invisible on a near-white button — movement is
     what reads as "pressed" across a room */
  #controls button { flex: 1; transition: transform .13s ease, filter .13s ease; }
  /* .pressed is applied instantly and eases back on release; :active still
     covers mouse and keyboard, where holding makes it visible anyway */
  #controls button.pressed { transform: scale(.96); filter: brightness(.88); transition-duration: 0s; }
  #controls button:active  { transform: scale(.96); filter: brightness(.88); }
  button:active { filter: brightness(.95); }
  button.primary { background: var(--accent); color: #fff; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* ---------- projector / wide ---------- */
  @media (min-width: 900px) {
    #stage { padding: 0 5vw 2vh; }
    /* the cover is image-led: shrink the wordmark so the square can take the height */
    .cover { gap: 1.4vh; }
    .cover .lozenge { font-size: clamp(28px, 6vh, 70px); }
    .scr.split {
      display: grid; grid-template-columns: minmax(0,5fr) minmax(0,7fr);
      grid-template-rows: auto minmax(0,1fr); gap: clamp(16px, 2.6vh, 32px) 4vw; align-items: center;
    }
    .scr.split .scr-head { grid-column: 1 / -1; }
    .scr.split .imgwrap { margin: 0; height: 100%; min-height: 0; }
    /* centred grid items overflow BOTH ways when taller than the track —
       that is what put tags over the title and cut the tip off. */
    .scr.split > .body { min-height: 0; max-height: 100%; overflow: hidden; }
    /* tip matches tag size here; it was reading small next to rounds and chips */
    .tip p { font-size: 1.14em; }
  }
  @media (prefers-reduced-motion: reduce) { .spin svg, .dot { animation: none; } #controls button { transition: none; } }
</style>
</head>
<body class="syncing wake">

<div id="banner"></div>
<div id="timer"><div id="timerfill"></div></div>

<header>
  <span id="hostinfo"><b id="roomlbl"></b><span id="hostclock"></span></span>
  <span id="logowrap"><img id="logo" class="mark" src="speaktiger-footer-sqr.png" alt="SpeakTiger" draggable="false"></span>
  <span id="mode"></span>
</header>

<div id="syncmsg">syncing…</div>
<div id="stage"></div>

<footer>
  <div id="diag"></div>
  <div id="wakebar">
    <span id="wakestate">screen lock: not requested</span>
  </div>
  <div id="retrybar"><button id="retry">Retry connection</button><button id="hard">Hard reset</button></div>
  <div id="count"></div>
  <div id="tipswrap">
    <div id="notes"></div>
    <div id="tipsbar"><i id="tipsarrow"></i><span>Host tips</span></div>
  </div>
  <div id="controls">
    <button id="prev">‹ Back</button>
    <button id="next" class="primary">Next ›</button>
  </div>
</footer>

<script>
/* ==================================================================
   CONTENT — 32 screens. Data, not code.
   tags = keyword cloud (deck).  qs = spare questions (handout), 3 each.
================================================================== */
const SCREENS = [
{ n:1, type:"cover",
  sub:"we'll start shortly",
  img:{ id:"cover", ratio:"1/1", label:"cover photo — room in use" },
  say:"Nothing yet. Greet people, point them at the seating list. This screen is up for about 25 minutes while everyone arrives — leave it.",
  cues:["Table cards out, every arrow checked","Paper question sheets on every table","Sticky stack written and in order","Ask about phone battery at check-in"] },

{ n:2, type:"instruction",
  title:"Take your seat",
  tip:"Your sticky has a table number and a colour. Find the table and take your seat.",
  img:{ id:"sticky", ratio:"4/3", label:"sticky note — purple + yellow" },
  say:"Your sticky has a number and a colour. The number is your table. Find it and sit down. If you can't find your table, raise your hand and I'll come to you.",
  cues:["Point at the room, not at the screen","Anyone standing still is a lost guest"] },

{ n:3, type:"test",
  title:"Test your phone", sub:"Tap the button below.",
  btn:"I'm ready",
  okTitle:"You're all set", okSub:"Keep this page open.", okBtn:"Connected",
  badTitle:"✋ Raise your hand",
  badSub:["Looks like you're offline.","The app still works on your phone.","We'll bring you a paper version too, just in case."],
  badBtn:"No connection",
  say:"Open the link and tap the button on your screen. It should turn green. If your screen did not turn green, raise your hand — I'll bring you a paper sheet.",
  cues:["Wait. Count the hands before you move on","Hand out paper sheets now — last easy moment","This tap is also what keeps their screens awake"] },

{ n:4, type:"cover", brandOnly:true,
  say:"Welcome to Speed Friending. My name is ___. Two hours, everyone in this room, one conversation at a time.",
  cues:["Get the room quiet before you start"] },

{ n:5, type:"info",
  title:"What this is",
  tags:["Meeting new people","Structured 1-on-1 way","Rounds of conversations"],
  img:{ id:"what", ratio:"4/3", label:"illustration — pairs at tables" },
  say:"Here's the idea. You meet everyone in this room, one on one. Each conversation has a topic and a time limit. You never have to work out what to say — the screen does that part.",
  cues:[] },

{ n:6, type:"info",
  title:"Topics, keywords, questions",
  tags:["📋 topics","⭐ keywords","📃 list of questions"],
  tip:"The topic and keywords are on this screen. The full list of questions is on the sheet on your table.",
  img:{ id:"anatomy", ratio:"4/3", label:"phone + paper sheet — NEW artwork" },
  say:"Every round has a topic. Your phone shows the topic and a few keywords. The sheet on your table has the full list of questions. Use them, or ignore them — they're there so nobody has to sit in silence.",
  cues:["This is the screen that makes the rest of the night self-service","Hold up an actual paper sheet while you say it"] },

{ n:7, type:"info",
  title:"‼️ Ground rules",
  tags:["✅ be present","✅ be open","✅ be respectful","❌ no private questions","❌ do not persist","🙋 raise hand"],
  tagColors:["green","green","green","coral","coral","blue"],
  img:{ id:"rules", ratio:"4/3", label:"illustration — four people talking" },
  say:"Four rules. Be present — phones away except for this page. Be open. Be respectful. No private questions, and if someone would rather not answer, let it go. And if you need me at any point, raise your hand.",
  cues:["\"do not persist\" still needs rewriting"] },

{ n:8, type:"info",
  title:"⏳ Each round is 8 minutes",
  tags:["⏲️ change seats after the time is up","📱 exchange contacts (if you like)","✅ extra time at the end of the event"],
  img:{ id:"clock", ratio:"4/3", label:"hand holding clock" },
  say:"Each round is eight minutes. When time is up the screen will tell you, and you change seats then — not before. Exchange contacts if you want to. And there's free time at the end, so you're not saying goodbye forever at the eight-minute mark.",
  cues:[] },

{ n:9, type:"info",
  title:"How the night runs", flow:true,
  tags:["💬 5 rounds","⏰ 10 min break","💬 4 rounds","👯 1 group round","🔀 free flow"],
  img:{ id:"runorder", ratio:"4/3", label:"illustration — two people talking" },
  say:"Five rounds, a ten-minute break, four more rounds, one group round, then free flow until we close.",
  cues:[] },

{ n:10, type:"info",
  title:"‼️ Changing the tables",
  tip:"Purple moves. Yellow stays.",
  img:{ id:"rotation", ratio:"4/3", label:"table render — purple + yellow stickies, arrows" },
  say:"When a round ends: purple moves, yellow stays. Purple — look at the card on your table, it has a number and an arrow. That's the table you go to. Yellow — you don't move all night.",
  cues:["Say it twice. This is the one thing that breaks","Point at a real table card while you say it","Everything after this is the app's job"] },

/* ---------------- ROUNDS 1–5 ---------------- */
{ n:11, type:"round", secs:495, round:1, title:"Work",
  tags:["Work place","Field","Remote or office","Hardest tasks","Why this job?","What's next?"],
  img:{ id:"r1", ratio:"4/3", label:"round 1 image" },
  qs:["What do you do for a living?","If you didn't have to work for money, would you still do the same job?","Why did you decide to choose this career path?"],
  say:"Round one: work. Eight minutes. Go.",
  cues:["Start the timer as you say go","Walk the room once — check for empty seats"] },

{ n:12, type:"rotate", title:"TIME'S UP", next:2, nextTitle:"Travelling & Adventures" },

{ n:13, type:"round", secs:495, round:2, title:"Travelling & Adventures",

/* ==================================================================
   CONFIG — unchanged from v11
================================================================== */
const API_MAIN   = "https://sync.speaktiger.app";
const API_OLD    = "https://speaktiger-sync.speaktiger.workers.dev";
const POLL_MS    = 3000;    // TESTING. Phase-based later.
const RETRY_MS   = 4000;
const TIMEOUT_MS = 7000;
const PROBE_MS   = 4000;   // screen 3: two tries inside ~8s beats one slow try
const WRITE_MS   = 4000;   // host writes fail fast; a retry beats one long wait
const SYNC_DELAY = 400;
const STALE_MS   = 10000;
const OFF_MS     = 30000;
const SW_CACHE   = "speaktiger-shell";   // prefix; the worker versions it
const QUIET_MS   = 30000;
const VERSION    = "0.9-beta";   // shown in diagnostics
const MAX_SCREEN = SCREENS.length;

/* ==================================================================
   STATE — unchanged from v11
================================================================== */
const params  = new URLSearchParams(location.search);
const room    = params.get("r") || "lisbon";
const key     = params.get("k");
const isHost  = !!key;
const QUIET   = params.get("quiet") === "1";
const API     = params.get("api") === "old" ? API_OLD : API_MAIN;
const PREVIEW = params.get("preview") === "1";   // REVIEW TOOL — remove before ship

const startedAt = Date.now();
let screenNo = null, lastUpdatedAt = -1, lastOkAt = 0, manual = null;
let haveData = false, showSyncing = true, syncTimer = null;
let current = null, generation = 0, consecFails = 0;   // current = { ctrl, kind } or null
let pulls = 0, fails = 0, timeouts = 0;
let lastErr = "", swState = "none", proto = "?", pushErr = "";
let clockOffset = 0;        // serverNow - localNow, from every response
let endsAt = null, endsScreen = null;   // a deadline belongs to ONE screen
let localEnds = null, localScreen = null;   // host-only stopwatch, LOCAL clock
const LOGO_MARK = "speaktiger-footer-sqr.png";
const LOGO_FULL = "speaktiger-logo-white.png";
const KEEP_MS   = 6 * 60 * 60 * 1000;   // a remembered screen goes stale
const serverTime = () => Date.now() + clockOffset;
let wakeLock = null, nextTryAt = 0, quietSince = 0;
let renderedScreen = null, testState = "idle", forceOffline = false;
let wasDown = false, okUntil = 0;   // drives the "Status: online" confirmation
let detached = false, detachScreen = null;   // guest following by hand on purpose
let sendingSince = 0, sendSeq = 0;           // host write in flight, and who owns the indicator
let wakePending = false;                     // one wake-lock request at a time

const $ = (id) => document.getElementById(id);
$("mode").textContent = isHost ? "host" : "";
if (isHost) document.body.classList.add("host");
if (PREVIEW) document.body.classList.add("preview");
if (params.get("debug") === "1") document.body.classList.add("debug");
if (params.get("diag") === "0") { $("diag").classList.add("off"); document.body.classList.remove("wake"); }

/* A remembered screen is only useful for minutes, not days — after six hours
   it belongs to a finished event and would open on the wrong screen. */
try {
  const raw = JSON.parse(localStorage.getItem("st_screen_" + room));
  if (raw && Number.isInteger(raw.s) && raw.s >= 1 && raw.s <= MAX_SCREEN &&
      Number.isFinite(raw.t) && Date.now() - raw.t < KEEP_MS) {
    screenNo = raw.s;
  }
} catch (e) {}

if (isHost) {
  try {
    const raw = JSON.parse(localStorage.getItem("st_local_" + room));
    if (raw && Number.isFinite(raw.e) && Number.isInteger(raw.s) &&
        Number.isFinite(raw.t) && Date.now() - raw.t < KEEP_MS) {
      localEnds = raw.e; localScreen = raw.s;
    }
  } catch (e) {}
}

if (PREVIEW) {
  const s = parseInt(params.get("s") || "1", 10);
  screenNo = Number.isInteger(s) && s >= 1 && s <= MAX_SCREEN ? s : 1;
  haveData = true; showSyncing = false; lastOkAt = Date.now();
}

/* ==================================================================
   STAGE
================================================================== */
const esc = (s) => String(s).replace(/[&<>]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;" }[c]));

const imgBox = (o) => !o ? "" :
  `<div class="imgwrap">` + (o.src
    ? `<img src="${esc(o.src)}" alt="" style="--ratio:${esc(o.ratio)}">`
    : `<div class="ph" style="--ratio:${esc(o.ratio)}">${esc(o.id)} · ${esc(o.ratio)}<br>${esc(o.label)}</div>`) +
  `</div>`;

const PALETTE = ["blue","green","teal","coral"];
const CHEV = `<li class="chev" aria-hidden="true"><svg viewBox="0 0 26 15" fill="none">` +
  `<path d="M4 4 L13 12 L22 4" stroke="var(--green)" stroke-width="5" ` +
  `stroke-linecap="round" stroke-linejoin="round"/></svg></li>`;

const tagList = (a, colors, mode) => {
  if (!a || !a.length) return "";
  const cls = mode === "stack" ? " stack" : mode === "flow" ? " stack flow" : "";
  const items = a.map((t, i) => {
    const c = (colors && colors[i]) || PALETTE[i % PALETTE.length];
    /* flex-grow tracks text length so cloud rows justify proportionally */
    return `<li class="t-${c}" style="flex-grow:${Math.max(2, t.length)}">${esc(t)}</li>`;
  });
  return `<ul class="tags${cls}">${mode === "flow" ? items.join(CHEV) : items.join("")}</ul>`;
};

const bandBlock = (bands) => !bands || !bands.length ? "" :
  `<div class="qband">${bands.map(b =>
    `<div class="qsec"><div class="qhead">${esc(b.head)}</div>` +
    `<ul>${b.items.map(q => `<li>${esc(q)}</li>`).join("")}</ul></div>`).join("")}</div>`;

const tipBlock = (t) => !t ? "" :
  `<div class="tip"><span class="ico" aria-hidden="true">i</span><p>${esc(t)}</p></div>`;

const SPIN = `<div class="spin" aria-hidden="true"><svg viewBox="0 0 100 100" fill="none">
<g stroke="var(--move)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
<path d="M24 62 L24 44 A20 20 0 0 1 44 24 L58 24"/>
<path d="M50 16 L58 24 L50 32"/>
<path d="M76 38 L76 56 A20 20 0 0 1 56 76 L42 76"/>
<path d="M50 84 L42 76 L50 68"/>
</g>
</svg></div>`;

const ROTATE_IMG = { id:"rotate", ratio:"4/3", label:"table card — number + arrow" };

function head(eyebrow, title, sub) {
  const lines = sub == null ? [] : (Array.isArray(sub) ? sub : [sub]);
  return `<div class="scr-head">${eyebrow ? `<div class="eyebrow">${esc(eyebrow)}</div>` : ""}` +
    (title ? `<h1>${esc(title)}</h1>` : "") +
    lines.map(l => `<p class="sub">${esc(l)}</p>`).join("") + `</div>`;
}

/* screens carrying a tip use a centred single column so the image never
   leans into an empty grid track; everything else keeps the deck's split */
/* Every screen that has both an image and body content splits on a wide
   viewport (image left, content right) and stacks on a phone. Screens with
   no body — the cover — stay centred so the image never leans into an
   empty grid track. */
function shell(s, eyebrow, body, extra) {
  const cls = (body ? "scr split" : "scr mid") + (extra ? " " + extra : "");
  return `<div class="${cls}">${head(eyebrow, s.title, s.sub)}${imgBox(s.img)}` +
    (body ? `<div class="body">${body}</div>` : "") + `</div>`;
}

function stageHTML(s) {
  if (!s) return "";
  switch (s.type) {
    case "cover":
      return `<div class="scr"><div class="cover"><div class="lozenge">SPEED<br>FRIENDING</div>` +
        (s.brandOnly ? "" : imgBox(s.img) + (s.sub ? `<p class="sub">${esc(s.sub)}</p>` : "")) + `</div></div>`;

    case "instruction":
    case "break":
      return shell(s, null, tipBlock(s.tip));

    case "info":
      return shell(s, null, tagList(s.tags, s.tagColors, s.flow ? "flow" : "stack") + tipBlock(s.tip));

    case "test": {
      if (testState === "ok")
        return `<div class="scr"><div class="test">${head(null, s.okTitle, s.okSub)}` +
          `<button id="testbtn" class="ok">\u2713 ${esc(s.okBtn)}</button></div></div>`;
      if (testState === "bad")
        return `<div class="scr"><div class="test">${head(null, s.badTitle, s.badSub)}` +
          `<button id="testbtn" class="bad">\u2715 ${esc(s.badBtn)}</button></div></div>`;
      const busy = testState === "checking";
      return `<div class="scr"><div class="test">${head(null, s.title, s.sub)}` +
        `<button id="testbtn" class="primary">${esc(busy ? "checking\u2026" : s.btn)}</button></div></div>`;
    }

    case "round":
      return shell(s, "🏆 Round " + s.round,
        tagList(s.tags) + bandBlock([{ head: "Sample questions:", items: s.qs }]));

    case "group":
      return shell(s, "🏆 Round " + s.round, tagList(s.tags) + bandBlock(s.bands));

    case "rotate":
      return shell({ ...s, img: s.img || ROTATE_IMG }, null,
        `<div class="chips">` +
          `<div class="chip move"><b>Purple</b> move to the next table</div>` +
          `<div class="chip stay"><b>Yellow</b> stay where you are</div>` +
        `</div>${SPIN}`, "rot");

    case "closing":
      return shell(s, null, tipBlock(s.tip) +
        `<div style="text-align:center;font-weight:900;color:var(--accent);font-size:clamp(17px,2.9vmin,34px)">${esc(s.handle)}</div>`);
  }
  return "";
}

function notesHTML(s) {
  if (!s) return "";
  const r = s.type === "rotate";
  const say = r ? (s.afterBreak
        ? "Back in your seats first. Then — purple moves, yellow stays."
        : "Time's up. Purple, check the card on your table and move to that number. Yellow, stay where you are.")
    : s.say;
  const cues = r ? (s.afterBreak
        ? ["Count the room before you advance","Anyone left alone becomes purple — their table closes"]
        : ["Wait for the room to settle before the next round","Anyone left alone becomes purple — their table closes"])
    : (s.cues || []);
  const spare = (s.type === "round") ? s.qs : null;
  return `<div class="lbl">Screen ${s.n} · say</div><div>${esc(say)}</div>` +
    (r ? `<div class="lbl" style="margin-top:12px">next</div><div>Round ${s.next} · ${esc(s.nextTitle)}</div>` : "") +
    (cues.length ? `<div class="lbl" style="margin-top:12px">do</div><ul class="cues">${cues.map(c => `<li>${esc(c)}</li>`).join("")}</ul>` : "") +
    (spare ? `<div class="lbl" style="margin-top:12px">also on the table sheet</div><ul class="qs">${spare.map(q => `<li>${esc(q)}</li>`).join("")}</ul>` : "");
}

/* Shrink the body block until it fits its box. The body's type and spacing are
   all em-relative, so one font-size governs the whole block. Binary search, so
   at most 10 reflows, and only on a screen change or a resize. */
function fitBody() {
  const scr = document.querySelector("#stage .scr");
  const b = scr && scr.querySelector(".body");
  if (!b) return;
  b.style.fontSize = "";
  const over = () => b.scrollHeight > b.clientHeight + 1 || scr.scrollHeight > scr.clientHeight + 1;
  if (!over()) return;
  const base = parseFloat(getComputedStyle(b).fontSize) || 16;
  let lo = 0.55, hi = 1;
  for (let i = 0; i < 10; i++) {
    const mid = (lo + hi) / 2;
    b.style.fontSize = (base * mid).toFixed(2) + "px";
    if (over()) hi = mid; else lo = mid;
  }
  b.style.fontSize = (base * lo).toFixed(2) + "px";
}
const scheduleFit = () => requestAnimationFrame(fitBody);

/* repaint the current screen WITHOUT resetting its local state */
function repaintStage() {
  if (renderedScreen === null) return;
  const s = SCREENS[renderedScreen - 1];
  $("stage").innerHTML = stageHTML(s);
  bindStage();
  scheduleFit();
}

function bindStage() {
  const tb = $("testbtn");
  if (!tb || testState === "ok" || testState === "bad") return;
  tb.onclick = async () => {
    if (testState === "checking") return;
    testState = "checking";
    acquireWakeLock(false);        // must ride the real user gesture
    repaintStage();
    const ok = await probe();      // its own request, judged on its own result
    testState = ok ? "ok" : "bad";
    if (!ok) forceOffline = true;  // manual now; the loop keeps retrying silently
    repaintStage();
    render();
  };
}

function renderStage(shown) {
  if (shown === renderedScreen) return;
  renderedScreen = shown;

  /* full lockup on the cover, circle everywhere else — the Soda pattern */
  const logo = $("logo"), wantFull = shown === 1;
  const wantSrc = wantFull ? LOGO_FULL : LOGO_MARK;
  if (!logo.src.endsWith(wantSrc)) logo.src = wantSrc;
  logo.classList.toggle("mark", !wantFull);

  /* the bar would otherwise animate backwards for a second on every advance */
  const t = $("timer");
  t.classList.add("jump");
  renderTimer(shown);
  requestAnimationFrame(() => t.classList.remove("jump"));
  testState = "idle";
  const s = SCREENS[shown - 1];
  $("stage").innerHTML = stageHTML(s);
  $("notes").innerHTML = notesHTML(s);
  $("notes").scrollTop = 0;
  document.body.classList.remove("tipsopen");
  bindStage();
  scheduleFit();
}

/* ==================================================================
   RENDER — chrome only
================================================================== */
const DOTS = '<span class="dot">\u00b7</span><span class="dot">\u00b7</span><span class="dot">\u00b7</span>';
function setBanner(text, kind, dots) {
  const b = $("banner");
  b.innerHTML = text ? (esc(text) + (dots ? " " + DOTS : "")) : "";
  b.className = text ? ("on " + (kind || "")) : "";
}

function clock(ms) {
  const t = Math.max(0, Math.round(ms / 1000));
  return Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0");
}

/* Every phone counts toward the same absolute instant on the server's clock,
   so a screen that slept for four minutes wakes up in the right place instead
   of resuming a stale count. */
function renderTimer(shown) {
  const wrap = $("timer"), fill = $("timerfill");
  const s = shown === null ? null : SCREENS[shown - 1];
  const total = s && s.secs ? s.secs * 1000 : 0;
  /* endsScreen is what stops a manually-entered round inheriting the previous
     round's deadline — and it hides the host's bar while offline for free,
     because nothing has stamped a deadline for the screen they are on. */
  if (!total || endsAt === null || endsScreen !== shown) {
    wrap.classList.remove("on");
    return 0;
  }
  wrap.classList.add("on");
  const left = Math.max(0, endsAt - serverTime());
  fill.style.width = Math.min(100, Math.max(0, (1 - left / total) * 100)).toFixed(2) + "%";
  return left;
}

function render() {
  const shown = manual !== null ? manual : screenNo;

  const age     = Date.now() - (lastOkAt || startedAt);
  const offline = !PREVIEW && (forceOffline || age > OFF_MS);
  const stale   = !PREVIEW && !offline && age > STALE_MS;
  const syncing = showSyncing && !haveData && !offline && !stale && shown === null;
  /* separate from `syncing`, which also drives .syncing #stage { display:none } —
     loosening that one would hide the cached screen we are deliberately showing */
  const unsynced = !PREVIEW && !haveData && !offline && !stale;

  document.body.classList.toggle("syncing", syncing);
  document.body.classList.toggle("stale",   stale);
  document.body.classList.toggle("offline", offline);

  if (shown !== null) renderStage(shown);
  $("count").textContent = shown === null ? "" : shown + " / " + MAX_SCREEN;

  const left = renderTimer(shown);
  /* room label for host and debug only; digits are the host's alone */
  $("roomlbl").textContent = (isHost || document.body.classList.contains("debug")) ? room : "";

  const scr = shown === null ? null : SCREENS[shown - 1];
  let txt = "", cls = "";
  if (isHost && left > 0) {
    txt = clock(left);                                   // the room is on this clock
  } else if (isHost && offline && scr && scr.secs) {
    if (localScreen === shown && localEnds !== null) {
      const l = localEnds - Date.now();
      txt = l >= 0 ? clock(l) : "+" + clock(-l);          // running over is the useful number
      cls = l >= 0 ? "local" : "local over";
    } else {
      txt = "▶ " + clock(scr.secs * 1000);                // tap to start
      cls = "local idle";
    }
  }
  $("hostclock").textContent = txt;
  $("hostclock").className = cls;

  /* one banner treatment for every system state */
  const sending = sendingSince > 0 && Date.now() - sendingSince > 400;
  const down = !PREVIEW && (!!pushErr || offline || stale || unsynced || detached);
  if (down) { wasDown = true; okUntil = 0; }
  else if (wasDown) { wasDown = false; okUntil = Date.now() + 2600; }

  document.body.classList.toggle("detached", detached);

  if (PREVIEW)                setBanner("preview — not synced", "");
  else if (pushErr)           setBanner(pushErr, "bad");
  else if (sending)           setBanner("sending", "", true);
  /* For a guest, offline means "follow along by hand" — harmless. For the host
     it means their taps are not reaching the room, which is an emergency, and
     their screen still advances locally. Different words, different colour. */
  else if (offline && isHost) setBanner("offline — the room is not moving", "bad", true);
  else if (offline)           setBanner("offline mode", "grey");       // settled, no dots
  else if (stale)             setBanner("reconnecting", "", true);
  else if (detached)          setBanner("manual mode", "");
  else if (unsynced)          setBanner("connecting", "", true);
  else if (Date.now() < okUntil) setBanner("Status: online", "good");
  else                        setBanner("", "");

  const secs = lastOkAt ? Math.round((Date.now() - lastOkAt) / 1000) + "s ago" : "never";
  $("diag").innerHTML =
    `v${VERSION} · last ok: ${secs} · polls ${pulls} · fails ${fails} · timeouts ${timeouts}` +
    `<br>onLine: ${navigator.onLine} · sw: ${swState} · consec ${consecFails}` +
    ` · ${current ? current.kind : "idle"} · proto ${proto}` +
    ` · clock ${clockOffset >= 0 ? "+" : ""}${clockOffset}ms` +
    (QUIET ? ` · QUIET${quietPause() ? " " + quietLeft() + "s" : ""}` : "") +
    (lastErr ? `<br><span style="color:var(--bad)">${esc(lastErr)}</span>` : "");
}

/* ==================================================================
   NETWORK — unchanged from v11
================================================================== */
function readProtocol(url) {
  try {
    const es = performance.getEntriesByType("resource");
    for (let i = es.length - 1; i >= 0; i--) {
      if (es[i].name.startsWith(url.split("?")[0]) && es[i].nextHopProtocol) { proto = es[i].nextHopProtocol; return; }
    }
  } catch (e) {}
}

/* A read is disposable — it repeats in POLL_MS. A write (host tap) and the
   connection probe are not, so they abort whatever is running and take the
   slot. The slot is only released by its own owner, which is what stops an
   aborted request from clearing the flag for the newer one that replaced it. */
function abortCurrent() {
  if (current) {
    current.superseded = true;     // aborted on purpose — not a network failure
    try { current.ctrl.abort(); } catch (e) {}
    current = null;
  }
}

async function request(kind, url, opts, deadline) {
  const me = { ctrl: new AbortController(), kind, superseded: false };
  current = me;
  const t = setTimeout(() => { try { me.ctrl.abort(); } catch (e) {} }, deadline || TIMEOUT_MS);
  try {
    const t0 = Date.now();
    const res = await fetch(url, { ...opts, signal: me.ctrl.signal, cache: "no-store" });
    const t1 = Date.now();
    if (!res.ok) {
      let msg = "HTTP " + res.status;
      try { const j = await res.json(); if (j && j.error) msg = j.error; } catch (e) {}
      throw new Error(msg);
    }
    const data = await res.json();
    if (typeof data.now === "number" && Number.isFinite(data.now)) {
      /* midpoint of the round trip, not the moment we finished parsing — the
         difference is half the latency, which on venue wifi is real */
      clockOffset = Math.round(data.now - (t0 + t1) / 2);
    }
    readProtocol(url);
    return data;
  } catch (e) {
    if (me.superseded) { const x = new Error("superseded"); x.name = "Superseded"; throw x; }
    throw e;
  } finally {
    clearTimeout(t);
    if (current === me) current = null;
  }
}

/* the server is trusted no further than localStorage is */
function validScreen(v) {
  const n = typeof v === "number" ? v : parseInt(v, 10);
  return Number.isInteger(n) && n >= 1 && n <= MAX_SCREEN ? n : null;
}
/* Screen and deadline move as one. They used to be split — the deadline was
   unpacked in request(), before any caller had decided whether the response was
   stale — so a rejected out-of-order reply could still hand its deadline to the
   current screen. Binding endsScreen makes the pair self-checking. */
function applyState(data) {
  const n = validScreen(data.screen);
  if (n === null) {
    lastErr = "server sent screen " + data.screen + " (out of 1-" + MAX_SCREEN + ")";
    return false;
  }
  if (n !== screenNo) {
    screenNo = n;
    try { localStorage.setItem("st_screen_" + room, JSON.stringify({ s: n, t: Date.now() })); } catch (e) {}
  }
  const e = data.endsAt;
  if (e === null || e === undefined || Number.isFinite(e)) {
    endsAt = Number.isFinite(e) ? e : null;
    endsScreen = endsAt === null ? null : n;
  }
  return true;
}

/* Host emergency stopwatch. A fixed local deadline, not a countdown, so a
   reconnect retry cannot quietly extend the round. Survives a reload because
   the offline host's phone is exactly the one that might get refreshed. */
function startLocal(screen, secs) {
  localScreen = screen;
  localEnds = Date.now() + secs * 1000;
  try {
    localStorage.setItem("st_local_" + room,
      JSON.stringify({ e: localEnds, s: localScreen, t: Date.now() }));
  } catch (e) {}
}
function clearLocal() {
  localEnds = null; localScreen = null;
  try { localStorage.removeItem("st_local_" + room); } catch (e) {}
}
/* Recomputed at every attempt, never cached: a 4s timeout plus a retry must
   send LESS time than the first try did, not the same. */
function secsFor(target) {
  const full = (SCREENS[target - 1] || {}).secs || null;
  if (full === null) return null;
  if (localScreen === target && localEnds !== null) {
    const left = Math.round((localEnds - Date.now()) / 1000);
    return Math.max(1, Math.min(full, left));   // 1s floor: a full bar is honest, an empty one is not
  }
  return full;
}

const stateURL = () => `${API}/state?r=${encodeURIComponent(room)}&_=${Date.now()}`;

async function pull() {
  if (PREVIEW || current) return;          // never disturb a write or another read
  const myGen = ++generation;

  clearTimeout(syncTimer);
  if (!haveData) syncTimer = setTimeout(() => { showSyncing = true; render(); }, SYNC_DELAY);

  try {
    const data = await request("read", stateURL());
    if (myGen !== generation) return;

    /* The response arrived, so the network is healthy. That is true whether or
       not we go on to use the body. Keeping the two apart is what stops an
       out-of-order payload from being read as a dead connection. */
    lastOkAt = Date.now(); haveData = true; showSyncing = false;
    consecFails = 0; pushErr = ""; forceOffline = false;
    if (testState === "bad") { testState = "ok"; repaintStage(); }

    if (data.updatedAt !== undefined && data.updatedAt < lastUpdatedAt) return;
    if (data.updatedAt !== undefined) lastUpdatedAt = data.updatedAt;
    lastErr = "";

    /* The host ran the room by hand while offline, so their position is the
       truth the server has to catch up to. Adopting the server's older screen
       here would send the whole room backwards on the next tap. */
    if (isHost && manual !== null) {
      const want = manual;
      manual = null;
      screenNo = want;
      push(want);
      return;
    }

    /* A guest who detached on purpose stays put until the host actually moves
       the room. That change is the rejoin signal — nobody has to be told. */
    if (detached) {
      const v = validScreen(data.screen);
      if (v === null || v === detachScreen) return;
      detached = false; detachScreen = null;
    }

    applyState(data);
    manual = null;
    /* Below the reassert branch on purpose: that path returns above, so the
       reconnect write still sees the stopwatch and sends what is LEFT. Down
       here there is no pending reassert, so contact means the emergency is
       over. Covers the case where a stopwatch was started without ever
       tapping Next, which no write would otherwise clear. */
    if (localEnds !== null) clearLocal();
  } catch (e) {
    if (e && e.name === "Superseded") return;   // a host tap took the line
    fails++; consecFails++;
    if (e && e.name === "AbortError") timeouts++;
    lastErr = (e && (e.name + ": " + e.message)) || String(e);
    /* nothing cached and the first try failed — show screen 1 and hand over
       the buttons rather than leaving the guest on a blank page */
    if (screenNo === null) { screenNo = 1; forceOffline = true; }
  } finally {
    clearTimeout(syncTimer);
    pulls++; render();
  }
}

/* Screen 3. A real request of its own, judged on its own result — never on
   how long ago something else happened to succeed. */
async function probeOnce() {
  abortCurrent();
  try {
    const data = await request("test", stateURL(), undefined, PROBE_MS);
    lastErr = "";
    if (data.updatedAt !== undefined && data.updatedAt >= lastUpdatedAt) {
      lastUpdatedAt = data.updatedAt;
      applyState(data);
    }
    lastOkAt = Date.now(); haveData = true; showSyncing = false;
    consecFails = 0; pushErr = ""; forceOffline = false;
    return true;
  } catch (e) {
    if (e && e.name === "Superseded") return false;
    fails++; consecFails++;
    if (e && e.name === "AbortError") timeouts++;
    lastErr = (e && (e.name + ": " + e.message)) || String(e);
    return false;
  } finally { pulls++; render(); }
}

/* Fifty phones hit one access point at once, so the first attempt can lose on
   contention alone. The random wait keeps the retries from colliding exactly
   the way the first round did. */
async function probe() {
  if (await probeOnce()) return true;
  await new Promise(r => setTimeout(r, 300 + Math.random() * 500));
  return probeOnce();
}

async function pushOnce(target) {
  abortCurrent();                          // a host tap outranks a background read
  const url = `${API}/state?r=${encodeURIComponent(room)}&k=${encodeURIComponent(key)}&_=${Date.now()}`;
  const data = await request("write", url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    /* duration only — the deadline instant is the server's to compute */
    body: JSON.stringify({ screen: target, secs: secsFor(target) }),
  }, WRITE_MS);
  if (data.updatedAt !== undefined) lastUpdatedAt = data.updatedAt;
  lastErr = "";
  applyState(data);                // the server's answer, which may be
  lastOkAt = Date.now(); haveData = true;  // another device's write if it won
  consecFails = 0; pushErr = ""; forceOffline = false;
  /* The stopwatch exists only while the host is cut off, so ANY confirmed
     write retires it — matching the screen was an implementation detail, and
     it left a stale stopwatch behind whenever recovery happened on a later
     screen. Cleared only on success: clearing when the write STARTED would
     destroy the only clock the host had if that write then failed. */
  if (localEnds !== null) clearLocal();
}

async function push(target) {
  /* The indicator belongs to this write. An older, superseded write finishing
     later must not switch off the signal for the one that replaced it. */
  const mine = ++sendSeq;
  pushErr = "";
  sendingSince = Date.now();
  /* Only surfaced after 400ms: a healthy write finishes long before that, so
     the host sees nothing on a good network and a clear signal on a bad one. */
  setTimeout(() => { if (sendSeq === mine && sendingSince) render(); }, 450);

  let attempt = 0;
  try {
    while (true) {
      try {
        await pushOnce(target);
        return;                                            // confirmed by the server
      } catch (e) {
        if (e && e.name === "Superseded") return;          // a newer tap owns it now
        lastErr = (e && (e.name + ": " + e.message)) || String(e);
        if (e && e.message === "bad key") { pushErr = "bad key"; return; }
        if (++attempt < 2) {
          await new Promise(r => setTimeout(r, 200));
          /* pushOnce() aborts whatever is in flight, so without this check a
             retry waking from the pause would kill a newer tap and win with a
             stale target. Newest host action always wins. */
          if (sendSeq !== mine) return;
          continue;
        }
        /* Two failed attempts is evidence, not a blip. Hand the host local
           control now rather than making them wait out OFF_MS wondering why
           the button does nothing. */
        forceOffline = true;
        manual = target;
        pushErr = "";
        return;
      }
    }
  } finally {
    if (sendSeq === mine) sendingSince = 0;
    render();
  }
}

function quietPause() { return QUIET && consecFails >= 2 && Date.now() < nextTryAt; }
function quietLeft()  { return Math.max(0, Math.ceil((nextTryAt - Date.now()) / 1000)); }
function kick() { if (PREVIEW || current || quietPause()) return; pull(); }

/* ==================================================================
   CONTROLS
================================================================== */
function step(delta) {
  const base = manual !== null ? manual : (screenNo ?? 1);
  const target = Math.min(MAX_SCREEN, Math.max(1, base + delta));
  if (PREVIEW) { screenNo = target; render(); return; }
  const live = haveData && !forceOffline && (Date.now() - lastOkAt) <= OFF_MS;
  if (isHost && live) push(target); else { manual = target; render(); }
}
$("next").onclick = () => step(1);
$("prev").onclick = () => step(-1);

/* iOS Safari does not apply :active on touch unless the document carries a
   touch listener, and even where it does a tap can be too brief to see. Pointer
   events sidestep both. Nothing here calls preventDefault or stopPropagation,
   so the click still reaches the document listener that holds the wake lock. */
(function armPress() {
  const MIN_MS = 120;                     // a fast tap must still be visible
  ["prev", "next"].forEach((id) => {
    const b = $(id);
    if (!b) return;
    let at = 0, timer = null;
    b.addEventListener("pointerdown", () => {
      clearTimeout(timer);
      at = Date.now();
      b.classList.add("pressed");
    });
    const release = () => {
      clearTimeout(timer);
      const left = Math.max(0, MIN_MS - (Date.now() - at));
      timer = setTimeout(() => b.classList.remove("pressed"), left);
    };
    ["pointerup", "pointercancel", "pointerleave"].forEach((e) => b.addEventListener(e, release));
  });
})();
/* The digits are the control. Tap starts it; once running a tap does nothing,
   because a stray tap silently resetting the round clock is worse than not
   being able to restart. A deliberate 1s hold resets — the same gesture the
   app already uses for anything irreversible. */
(function armStopwatch() {
  const el = $("hostclock");
  if (!el) return;
  let timer = null, acted = false;
  const target = () => {
    if (!isHost || !document.body.classList.contains("offline")) return null;
    const shown = manual !== null ? manual : screenNo;
    const scr = shown === null ? null : SCREENS[shown - 1];
    return scr && scr.secs ? { shown, secs: scr.secs } : null;
  };
  el.addEventListener("pointerdown", () => {
    const t = target();
    if (!t) return;
    acted = false;
    clearTimeout(timer);
    timer = setTimeout(() => {
      acted = true;
      startLocal(t.shown, t.secs);                       // reset
      try { if (navigator.vibrate) navigator.vibrate(30); } catch (e) {}
      render();
    }, 1000);
  });
  ["pointerup", "pointercancel", "pointerleave"].forEach((e) =>
    el.addEventListener(e, () => { clearTimeout(timer); timer = null; }));
  el.addEventListener("click", () => {
    if (acted) { acted = false; return; }                // the hold already did it
    const t = target();
    if (!t) return;
    if (localScreen === t.shown && localEnds !== null) return;   // already running
    startLocal(t.shown, t.secs);
    render();
  });
})();

$("retry").onclick = () => { abortCurrent(); lastErr = ""; pushErr = ""; nextTryAt = 0; pull(); };

$("hard").onclick = async () => {
  /* offline this would delete the cache the app is running from, then fail to
     reload — turning "working offline" into a dead tab */
  if (!navigator.onLine) {
    pushErr = "reset blocked while offline";
    render();
    setTimeout(() => { pushErr = ""; render(); }, 4000);
    return;
  }
  try {
    if (navigator.serviceWorker) {
      const rs = await navigator.serviceWorker.getRegistrations();
      const here = new URL("./", location.href).href;
      await Promise.all(rs.filter(r => r.scope === here).map(r => r.unregister()));
    }
    if (window.caches) {
      const keys = await caches.keys();
      await Promise.all(keys.filter(k => k.startsWith(SW_CACHE)).map(k => caches.delete(k)));
    }
    localStorage.removeItem("st_screen_" + room);
  } catch (e) {}
  location.reload();
};

/* Tap or swipe the bar; never the panel, so a long tip can scroll without
   fighting a swipe-to-close. */
(function armTips() {
  const bar = $("tipsbar");
  if (!bar) return;
  const isOpen = () => document.body.classList.contains("tipsopen");
  const set = (v) => document.body.classList.toggle("tipsopen", v);
  let y0 = null, swiped = false;
  bar.addEventListener("pointerdown", (e) => { y0 = e.clientY; swiped = false; });
  bar.addEventListener("pointerup", (e) => {
    if (y0 === null) return;
    const dy = y0 - e.clientY;
    y0 = null;
    if (Math.abs(dy) > 24) { swiped = true; set(dy > 0); }   // up opens, down closes
  });
  bar.addEventListener("click", () => {
    if (swiped) { swiped = false; return; }                  // the swipe already decided
    set(!isOpen());
  });
})();

/* Deliberately not a visible control. A guest only needs this when the host
   says so out loud, and a button on screen would invite taps that break a room
   which is working fine. The target is the target now; it becomes the logo
   in the same slot later. */
(function armLongPress() {
  const el = $("logowrap");
  if (!el) return;
  let timer = null;
  const cancel = () => { clearTimeout(timer); timer = null; el.classList.remove("pressing"); };
  el.addEventListener("pointerdown", () => {
    if (isHost || PREVIEW) return;
    el.classList.add("pressing");
    clearTimeout(timer);
    timer = setTimeout(() => {
      cancel();
      if (detached) {                       // second hold rejoins by hand
        detached = false; detachScreen = null; manual = null;
      } else {
        detached = true;
        detachScreen = screenNo;            // the server screen we broke away from
        manual = screenNo ?? 1;
      }
      try { if (navigator.vibrate) navigator.vibrate(30); } catch (e) {}
      render();
    }, 1500);
  });
  ["pointerup", "pointerleave", "pointercancel"].forEach(ev => el.addEventListener(ev, cancel));
  el.addEventListener("contextmenu", (e) => e.preventDefault());
})();

document.addEventListener("keydown", (e) => {
  if (!(isHost || PREVIEW || detached || document.body.classList.contains("offline"))) return;
  if (e.key === "ArrowRight") step(1);
  if (e.key === "ArrowLeft")  step(-1);
});

/* ==================================================================
   WAKE LOCK — unchanged from v11
================================================================== */
function setWakeState(text, on) {
  const el = $("wakestate");
  el.textContent = "screen lock: " + text;
  el.classList.toggle("on", !!on);
}

async function acquireWakeLock(quiet) {
  if (!("wakeLock" in navigator)) { setWakeState("not supported", false); return; }
  if (wakeLock) { setWakeState("held", true); return; }
  /* Screen 3's button and the document-level fallback both see the same tap,
     and the held-check above sits before an await — so without this both would
     request a sentinel and one would go untracked. */
  if (wakePending) return;
  if (document.visibilityState !== "visible") return;
  wakePending = true;
  try {
    wakeLock = await navigator.wakeLock.request("screen");
    setWakeState("held", true);
    wakeLock.addEventListener("release", () => { wakeLock = null; setWakeState("released — tap the screen", false); });
  } catch (e) {
    wakeLock = null;
    setWakeState(quiet ? "tap the screen to keep it on"
                       : "refused (" + (e.name || "error") + ") — check Low Power Mode", false);
  } finally { wakePending = false; }
}
/* Permanent, not one-shot. The old version unbound itself after the first
   success, so if re-acquisition ever failed later there was no second chance
   for the rest of the night. Held lock => this is a no-op. */
document.addEventListener("click", () => { if (!wakeLock) acquireWakeLock(true); }, { passive: true });

/* ==================================================================
   LIFECYCLE — unchanged from v11
================================================================== */
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  kick();
  /* a frame's grace — iOS refuses a request made in the same tick as the
     visibility change, which is exactly the lock/unlock case */
  setTimeout(() => acquireWakeLock(true), 60);
});
window.addEventListener("resize",   scheduleFit);
window.addEventListener("online",   kick);
/* Safari requires a user gesture, so on iPhone this is refused and the
   permanent tap-anywhere fallback picks it up on the very next touch. Chrome
   does not require one, so Android guests get it without touching anything. */
window.addEventListener("pageshow", () => { kick(); setTimeout(() => acquireWakeLock(true), 60); });

const noSW = params.get("nosw") === "1";
if ("serviceWorker" in navigator) {
  if (noSW) {
    swState = "disabled";
    /* Same scope filter Hard reset uses. Every GitHub Pages repository shares
       one origin, so an unfiltered unregister would take out other projects. */
    const here = new URL("./", location.href).href;
    navigator.serviceWorker.getRegistrations()
      .then(rs => Promise.all(rs.filter(r => r.scope === here).map(r => r.unregister())))
      .catch(() => {});
  } else {
    swState = navigator.serviceWorker.controller ? "controlling" : "registering";
    navigator.serviceWorker.register("sw.js")
      .then(() => { swState = navigator.serviceWorker.controller ? "controlling" : "registered"; })
      .catch(() => { swState = "failed"; });
  }
} else { swState = "unsupported"; }

/* Ask the worker to store every screen's artwork up front, so a phone that
   drops off the network mid-event still has screen 29's image. The list is
   derived from the screen data — there is no second list to keep in sync.
   Deferred so a slow venue connection never blocks the app from being usable. */
function precache() {
  const sw = navigator.serviceWorker;
  if (!sw || !sw.controller) return;
  const assets = ["./", LOGO_MARK, LOGO_FULL]
    .concat(SCREENS.map(s => s.img && s.img.src).filter(Boolean));
  try { sw.controller.postMessage({ type: "precache", assets }); } catch (e) {}
}
if ("serviceWorker" in navigator && !noSW) {
  navigator.serviceWorker.addEventListener("controllerchange", () => setTimeout(precache, 1500));
  window.addEventListener("load", () => setTimeout(precache, 1500));
}

function nextDelay() {
  if (consecFails === 0) return POLL_MS;
  if (QUIET && consecFails >= 2) return QUIET_MS;
  return RETRY_MS;
}
function loop() {
  pull().finally(() => {
    const d = nextDelay();
    nextTryAt = Date.now() + d;
    if (QUIET && consecFails >= 2 && !quietSince) quietSince = Date.now();
    if (consecFails === 0) quietSince = 0;
    setTimeout(loop, d);
  });
}
if (!PREVIEW) loop();
render();
setInterval(render, 1000);
</script>
</body>
</html>
